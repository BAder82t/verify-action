# Builds a release from a pushed version tag, attaches a source archive and its checksum, and publishes a signed
# build-provenance attestation for the archive (Sigstore, verified with `gh attestation verify`).
# Only this workflow holds write permissions, and only on tag pushes.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the release
      id-token: write      # Sigstore signing identity
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an annotated tag, and tests that pass
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [ "$(git cat-file -t "refs/tags/${TAG}")" = "tag" ] || { echo "::error::${TAG} is a lightweight tag; use an annotated, signed tag"; exit 1; }
          node --test test/verify.test.mjs test/supply-chain.test.mjs
      - name: Build the archive and its checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="verify-action-${TAG}/" -o "verify-action-${TAG}.tar.gz" "${GITHUB_SHA}"
          sha256sum "verify-action-${TAG}.tar.gz" > "verify-action-${TAG}.tar.gz.sha256"
          cat "verify-action-${TAG}.tar.gz.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: verify-action-*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" --verify-tag --title "${TAG}" \
            --notes "Pin this release by its commit SHA: ${GITHUB_SHA}. Verify with: gh attestation verify verify-action-${TAG}.tar.gz --repo ${GITHUB_REPOSITORY}" \
            "verify-action-${TAG}.tar.gz" "verify-action-${TAG}.tar.gz.sha256"
